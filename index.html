<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Position Size Calculator</title>

<style>
/* =======================
   RESET + BASE
======================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080808;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont,
               "SF Pro Display", "SF UI Display",
               "Segoe UI", sans-serif;
  color: #FFFFFF;
}

/* =======================
   CARD
======================= */
.calculator {
  position: relative;
  width: 500px;
  height: 500px;
  background: #121212;
  border-radius: 70px;
  padding: 20px;
}

/* Gradient stroke */
.calculator::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 4px;
  border-radius: 70px;
  background: linear-gradient(to bottom, #3D3D3D, #2B2B2B);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* =======================
   TOP ROW
======================= */
.top-row {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-top: 12px;
}

/* Icon */
.icon-wrap {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: rgba(61, 61, 61, 0.3);
  border: 2.5px solid #3D3D3D;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 4px rgba(0,0,0,1), 0 0 0 2.5px rgba(0,0,0,0);
}

.icon-wrap img {
  width: 60px;
  height: 60px;
  object-fit: contain;
}

/* Values */
.top-values {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.units {
  font-size: 80px;
  font-weight: 600;
  line-height: 1;
}

.risk {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 4px;
}

.risk input {
  width: 42px;
  background: transparent;
  border: none;
  color: #FFFFFF;
  font-size: 18px;
  font-weight: 400;
  text-align: right;
  outline: none;
}

.money {
  color: #44B480;
  font-size: 18px;
  font-weight: 400;
}

/* =======================
   INPUT CARDS
======================= */
.inputs {
  margin-top: 60px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  width: 460px;
  height: 94px;
  margin: 0 auto;
  background: rgba(61,61,61,0.3);
  border-radius: 50px;
  display: flex;
  align-items: center;
  justify-content: space-around;
}

.label {
  font-size: 18px;
  font-weight: 400;
  color: #4D4D4D;
  text-align: center;
}

.value {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.value span {
  font-size: 18px;
  font-weight: 500;
}

.value input {
  width: 90px;
  background: transparent;
  border: none;
  outline: none;
  color: #FFFFFF;
  font-size: 25px;
  font-weight: 500;
  text-align: left;
}

/* Remove number steppers */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
}

/* =======================
   BUTTON
======================= */
button {
  margin-top: 14px;
  width: 460px;
  height: 94px;
  margin-left: auto;
  margin-right: auto;
  background: rgba(61,61,61,0.3);
  border: none;
  border-radius: 50px;
  font-size: 25px;
  font-weight: 600;
  color: #FFFFFF;
  cursor: pointer;
}

button:disabled {
  opacity: 0.35;
  cursor: default;
}

button:not(:disabled):hover {
  color: #44B480;
}
</style>
</head>

<body>

<div class="calculator">
  <div class="top-row">
    <div class="icon-wrap">
      <img src="bitcoin.png" alt="BTC">
    </div>

    <div class="top-values">
      <div class="units" id="units">0.00</div>
      <div class="risk">
        <input id="risk" type="number" value="1">%
        <span class="money" id="money">$0.00</span>
      </div>
    </div>
  </div>

  <div class="inputs">
    <div class="card">
      <div>
        <div class="label">Entry Price</div>
        <div class="value"><span>$</span><input id="entry" type="number" placeholder="0.00"></div>
      </div>
      <div>
        <div class="label" style="color:#FFFFFF;">Balance</div>
        <div class="value"><span>$</span><input id="balance" type="number" placeholder="0.00"></div>
      </div>
      <div>
        <div class="label">Stop Loss</div>
        <div class="value"><span>$</span><input id="stop" type="number" placeholder="0.00"></div>
      </div>
    </div>

    <button id="calculate" disabled>Calculate</button>
  </div>
</div>

<script>
const entry = document.getElementById("entry");
const balance = document.getElementById("balance");
const stop = document.getElementById("stop");
const riskInput = document.getElementById("risk");
const unitsEl = document.getElementById("units");
const moneyEl = document.getElementById("money");
const button = document.getElementById("calculate");

function validate() {
  button.disabled = !(entry.value && balance.value && stop.value);
}

[entry, balance, stop].forEach(i => i.addEventListener("input", validate));

button.addEventListener("click", () => {
  const entryPrice = parseFloat(entry.value);
  const stopPrice = parseFloat(stop.value);
  const balanceVal = parseFloat(balance.value);
  const riskPct = parseFloat(riskInput.value) / 100;

  if (entryPrice <= stopPrice) return;

  const riskAmount = balanceVal * riskPct;
  const units = riskAmount / (entryPrice - stopPrice);

  unitsEl.textContent = units.toFixed(2);
  moneyEl.textContent = `$${riskAmount.toFixed(2)}`;
});
</script>

</body>
</html>
